model:
  name: Qwen/Qwen3.5-27B
  revision: fc05daec18b0a78c049392ed2e771dde82bdf654

data:
  path: Benson555/SnapJudge
  config: image
  min_pixels: 200704
  max_pixels: 1254400
  prompt: Determine whether this mathematical proof was written by a human or generated by AI.

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: checkpoints/image
  learning_rate: 2.0e-4
  per_device_train_batch_size: 8
  effective_batch_size: 64
  num_train_epochs: 3
  warmup_steps: 30
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 20
  dataloader_num_workers: 6
  seed: 42

inference:
  batch_size: 8
